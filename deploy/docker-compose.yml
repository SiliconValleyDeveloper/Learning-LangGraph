# Lab + finance stack: Postgres+pgvector + Redis + API + DB UI
#
# Start everything:
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# API (container):  http://localhost:8001
# Postgres:         localhost:5433
# Redis:            localhost:6379
# DB UI (pgweb):    http://localhost:8082
# Adminer:          http://localhost:8083
# Local Ollama:     host.docker.internal:11434
#
# Infra only (finance F1):
#   docker compose -f deploy/docker-compose.yml up -d db redis db-ui adminer

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: langgraph-pgvector
    environment:
      POSTGRES_USER: langgraph
      POSTGRES_PASSWORD: langgraph
      POSTGRES_DB: langgraph
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-pgvector.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langgraph -d langgraph"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: langgraph-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  db-ui:
    image: sosedoff/pgweb:latest
    container_name: langgraph-pgweb
    ports:
      - "8082:8081"
    environment:
      PGWEB_DATABASE_URL: postgres://langgraph:langgraph@db:5432/langgraph?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: langgraph-adminer
    ports:
      - "8083:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: langgraph-api
    ports:
      - "8001:8000"
    environment:
      VECTOR_BACKEND: pgvector
      DATABASE_URL: postgresql://langgraph:langgraph@db:5432/langgraph
      EMBED_DIMS: "768"
      OCR_PROVIDER: auto
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen3:8b
      OLLAMA_EMBED_MODEL: nomic-embed-text
      OLLAMA_VISION_MODEL: moondream
      ADVANCED_UPLOAD_ROOT: /app/.data/advanced-uploads
      REDIS_URL: redis://redis:6379/0
      FINANCE_ENABLED: "true"
    volumes:
      - advanced_uploads:/app/.data/advanced-uploads
      - doc_uploads:/app/.data/doc-uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  advanced_uploads:
  doc_uploads:
